<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイムラインミステリ 〜推理の記録〜</title>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Shippori Mincho', serif;
            background-color: #fdfaf6;
            background-image: radial-gradient(#e6ce9e 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 装飾枠 */
        .decorative-border {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px solid #c5a059;
            border-radius: 16px;
            pointer-events: none;
        }

        .decorative-border::before {
            content: "";
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 1px solid #e6ce9e;
            border-radius: 12px;
        }

        /* タイトル */
        .title-section {
            text-align: center;
            padding: 40px 20px 30px;
            position: relative;
            z-index: 1;
        }

        .main-title {
            font-size: 2.5em;
            color: #b71c1c;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 rgba(197, 160, 89, 0.3);
            animation: slideInDown 0.5s ease;
        }

        .main-title span {
            display: inline-block;
        }

        .sub-title {
            font-size: 1.2em;
            color: #5d4037;
            letter-spacing: 0.2em;
            opacity: 0.8;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .divider {
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c5a059, transparent);
            margin: 20px auto;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* ゲームカード */
        .games-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .game-card {
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #fafafa 100%);
            border-radius: 12px;
            padding: 28px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 2px solid transparent;
            overflow: hidden;
            animation: slideInLeft 0.5s ease;
            /* button リセット */
            appearance: none;
            -webkit-appearance: none;
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            text-align: left;
            width: 100%;
        }

        .game-card:nth-child(1) {
            animation-delay: 0.3s;
            animation-fill-mode: both;
        }

        .game-card:nth-child(2) {
            animation-delay: 0.5s;
            animation-fill-mode: both;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .game-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.5) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card:active {
            transform: translateY(0) scale(0.98);
        }

        .game-card:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(183, 28, 28, 0.25);
        }

        .game-card.valentine:focus-visible {
            box-shadow: 0 0 0 3px rgba(216, 27, 96, 0.25);
        }

        /* 成人の日カード */
        .game-card.seijin {
            border-color: #b71c1c;
            background: linear-gradient(135deg, #fff 0%, #ffe8e8 100%);
        }

        .game-card.seijin .card-icon {
            color: #b71c1c;
            font-size: 3em;
            margin-bottom: 15px;
        }

        .game-card.seijin .card-title {
            color: #b71c1c;
        }

        .game-card.seijin .card-action {
            background: #b71c1c;
        }

        /* バレンタインカード */
        .game-card.valentine {
            border-color: #d81b60;
            background: linear-gradient(135deg, #fff 0%, #ffe8f0 100%);
        }

        .game-card.valentine .card-icon {
            color: #d81b60;
            font-size: 3em;
            margin-bottom: 15px;
        }

        .game-card.valentine .card-title {
            color: #d81b60;
        }

        .game-card.valentine .card-action {
            background: #d81b60;
        }

        /* お正月カード */
        .game-card.january {
            border-color: #c62828;
            background: linear-gradient(135deg, #fff 0%, #fff8e1 100%);
        }
        .game-card.january .card-icon { color: #c62828; font-size: 3em; margin-bottom: 15px; }
        .game-card.january .card-title { color: #c62828; }
        .game-card.january .card-action { background: #c62828; }
        .game-card.january:focus-visible { box-shadow: 0 0 0 3px rgba(198,40,40,0.25); }

        /* ハロウィンカード */
        .game-card.halloween {
            border-color: #e65100;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1040 100%);
            color: #f3e5f5;
        }
        .game-card.halloween .card-icon { color: #ff8a65; font-size: 3em; margin-bottom: 15px; }
        .game-card.halloween .card-title { color: #ff8a65; }
        .game-card.halloween .card-subtitle { color: #e1bee7; }
        .game-card.halloween .card-action { background: #e65100; }
        .game-card.halloween:focus-visible { box-shadow: 0 0 0 3px rgba(230,81,0,0.4); }

        /* 夏の海の家カード */
        .game-card.summer {
            border-color: #0277bd;
            background: linear-gradient(135deg, #fff 0%, #e1f5fe 100%);
        }
        .game-card.summer .card-icon { color: #0277bd; font-size: 3em; margin-bottom: 15px; }
        .game-card.summer .card-title { color: #0277bd; }
        .game-card.summer .card-action { background: #0277bd; }
        .game-card.summer:focus-visible { box-shadow: 0 0 0 3px rgba(2,119,189,0.25); }

        /* クリスマスカード */
        .game-card.christmas {
            border-color: #1b5e20;
            background: linear-gradient(135deg, #fff 0%, #e8f5e9 100%);
        }
        .game-card.christmas .card-icon { color: #1b5e20; font-size: 3em; margin-bottom: 15px; }
        .game-card.christmas .card-title { color: #1b5e20; }
        .game-card.christmas .card-action { background: #1b5e20; }
        .game-card.christmas:focus-visible { box-shadow: 0 0 0 3px rgba(27,94,32,0.25); }

        /* ジューンブライドカード */
        .game-card.june {
            border-color: #6a1b9a;
            background: linear-gradient(135deg, #fff 0%, #f3e5f5 100%);
        }
        .game-card.june .card-icon { color: #6a1b9a; font-size: 3em; margin-bottom: 15px; }
        .game-card.june .card-title { color: #6a1b9a; }
        .game-card.june .card-action { background: #6a1b9a; }
        .game-card.june:focus-visible { box-shadow: 0 0 0 3px rgba(106,27,154,0.25); }

        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.8em;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .card-subtitle {
            font-size: 1.1em;
            color: #5d4037;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .card-action {
            display: inline-block;
            padding: 12px 30px;
            color: white;
            border-radius: 25px;
            font-size: 1em;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .game-card:hover .card-action {
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        /* フッター */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
            color: #999;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        /* モバイル対応 */
        @media (max-width: 600px) {
            .main-title {
                font-size: 1.8em;
            }

            .sub-title {
                font-size: 1em;
            }

            .game-card {
                padding: 20px;
            }

            .card-title {
                font-size: 1.4em;
            }

            .card-subtitle {
                font-size: 1em;
            }

            .card-header {
                flex-direction: column;
                gap: 10px;
            }
        }

        /* アニメーション低減設定への対応 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="decorative-border"></div>

        <div class="title-section">
            <h1 class="main-title"><span>タイムライン</span><span>ミステリ</span></h1>
            <p class="sub-title">〜推理の記録〜</p>
            <div class="divider"></div>
        </div>

        <div class="games-container">
            <!-- 成人の日 -->
            <button class="game-card seijin" aria-label="成人の日 — 消えた紅い祝い箱 — ゲームを開始する">
                <div class="card-header">
                    <div class="card-icon" role="img" aria-hidden="true">🎌</div>
                    <div>
                        <div class="card-title">成人の日</div>
                    </div>
                </div>
                <div class="card-subtitle">消えた紅い祝い箱</div>
                <span class="card-action" aria-hidden="true">開始する</span>
            </button>

            <!-- バレンタイン -->
            <button class="game-card valentine" aria-label="バレンタイン — 交錯するハートチョコ — ゲームを開始する">
                <div class="card-header">
                    <div class="card-icon" role="img" aria-hidden="true">💝</div>
                    <div>
                        <div class="card-title">バレンタイン</div>
                    </div>
                </div>
                <div class="card-subtitle">交錯するハートチョコ</div>
                <span class="card-action" aria-hidden="true">開始する</span>
            </button>

            <!-- お正月 -->
            <button class="game-card january" aria-label="お正月 — 消えた破魔矢 — ゲームを開始する">
                <div class="card-header">
                    <div class="card-icon" role="img" aria-hidden="true">⛩️</div>
                    <div>
                        <div class="card-title">お正月</div>
                    </div>
                </div>
                <div class="card-subtitle">消えた破魔矢</div>
                <span class="card-action" aria-hidden="true">開始する</span>
            </button>

            <!-- ハロウィン -->
            <button class="game-card halloween" aria-label="ハロウィン — 仮面の宴、逆さまの証言 — ゲームを開始する">
                <div class="card-header">
                    <div class="card-icon" role="img" aria-hidden="true">🎃</div>
                    <div>
                        <div class="card-title">ハロウィン</div>
                    </div>
                </div>
                <div class="card-subtitle">仮面の宴、逆さまの証言</div>
                <span class="card-action" aria-hidden="true">開始する</span>
            </button>

            <!-- 夏の海の家 -->
            <button class="game-card summer" aria-label="夏の海の家 — 碧玉の浜の三つの証言 — ゲームを開始する">
                <div class="card-header">
                    <div class="card-icon" role="img" aria-hidden="true">🌊</div>
                    <div>
                        <div class="card-title">夏の海の家</div>
                    </div>
                </div>
                <div class="card-subtitle">碧玉の浜の三つの証言</div>
                <span class="card-action" aria-hidden="true">開始する</span>
            </button>

            <!-- クリスマス -->
            <button class="game-card christmas" aria-label="クリスマス — 消えた銀の星 — ゲームを開始する">
                <div class="card-header">
                    <div class="card-icon" role="img" aria-hidden="true">🎄</div>
                    <div>
                        <div class="card-title">クリスマス</div>
                    </div>
                </div>
                <div class="card-subtitle">消えた銀の星</div>
                <span class="card-action" aria-hidden="true">開始する</span>
            </button>

            <!-- ジューンブライド -->
            <button class="game-card june" aria-label="ジューンブライド — 二つの誓い — ゲームを開始する">
                <div class="card-header">
                    <div class="card-icon" role="img" aria-hidden="true">💐</div>
                    <div>
                        <div class="card-title">ジューンブライド</div>
                    </div>
                </div>
                <div class="card-subtitle">二つの誓い</div>
                <span class="card-action" aria-hidden="true">開始する</span>
            </button>
        </div>

        <div class="footer">
            © 2026 Timeline Mystery Games
        </div>
    </div>

    <script>
        document.querySelector('.game-card.seijin').addEventListener('click', () => {
            location.href = 'seijin.html';
        });
        document.querySelector('.game-card.valentine').addEventListener('click', () => {
            location.href = 'valentine.html';
        });
        document.querySelector('.game-card.january').addEventListener('click', () => {
            location.href = 'january.html';
        });
        document.querySelector('.game-card.halloween').addEventListener('click', () => {
            location.href = 'halloween.html';
        });
        document.querySelector('.game-card.summer').addEventListener('click', () => {
            location.href = 'summer.html';
        });
        document.querySelector('.game-card.christmas').addEventListener('click', () => {
            location.href = 'christmas.html';
        });
        document.querySelector('.game-card.june').addEventListener('click', () => {
            location.href = 'june.html';
        });
    </script>
</body>

</html>
